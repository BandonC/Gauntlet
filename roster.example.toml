# Copy to roster.toml (gitignored) and edit.
#
# A player = provider + model + prompt version + settings. Change any of those and
# you have a NEW player: give it a new id, don't edit an existing entry that has
# already played recorded matches.
#
# Prices are USD per million tokens. VERIFY THEM on the provider pricing pages before
# a real tournament; cost tracking and budget caps are only as good as these numbers.

[providers.anthropic]
requests_per_minute = 50
max_concurrency = 8

# Optional: only for OpenAI players. Needs OPENAI_API_KEY in .env.
# [providers.openai]
# requests_per_minute = 60
# max_concurrency = 8

[[players]]
id = "random"
provider = "random"
seed = 1

# Scripted bots are free. `model` names the game; give each its own seed. Seven of them
# run a free Postgres Werewolf tournament:
# arena tournament --game werewolf --players ww1,...,ww7 --format tables --table-size 7 --tables 14
[[players]]
id = "ww1"
provider = "bot"
model = "werewolf"
seed = 1

[[players]]
id = "haiku-5.5/c4-v1"
provider = "anthropic"
model = "claude-haiku-5-5"
prompt = "connect4/v1"
temperature = "omit"            # the Anthropic adapter never sends sampling params
max_tokens = 256
price_input_per_mtok = 0.10     # verify
price_output_per_mtok = 0.50    # verify

[[players]]
id = "haiku-4.5/c4-v1"
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
prompt = "connect4/v1"
temperature = "omit"
max_tokens = 256
price_input_per_mtok = 1.00     # verify
price_output_per_mtok = 5.00    # verify

# Optional: only for OpenAI players. Needs OPENAI_API_KEY in .env and [providers.openai].
# [[players]]
# id = "gpt-5-mini/c4-v1"
# provider = "openai"
# model = "gpt-5-mini"
# prompt = "connect4/v1"
# temperature = "omit"          # don't send it: some OpenAI models reject non-default values
# max_tokens = 1024             # reasoning models spend output tokens before the tool call
# price_input_per_mtok = 0.25   # verify
# price_output_per_mtok = 2.00  # verify

# [[players]]
# id = "sonnet/c4-v1"
# provider = "anthropic"
# model = "<model id>"
# prompt = "connect4/v1"
# price_input_per_mtok = 0.0    # fill in
# price_output_per_mtok = 0.0   # fill in

# Werewolf: both Haikus in four play styles, so a 7-seat table has 7 distinct players.
# Messages are cut at 300 characters; max_tokens leaves room to see how far they ran over.

[[players]]
id = "haiku-5.5/ww-v1-plain"
provider = "anthropic"
model = "claude-haiku-5-5"
prompt = "werewolf/v1-plain"
temperature = "omit"
max_tokens = 512
price_input_per_mtok = 0.10
price_output_per_mtok = 0.50
price_cache_read_per_mtok = 0.01
price_cache_write_per_mtok = 0.125

