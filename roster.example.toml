[[players]]
id = "haiku-5.5/c4-v1"
provider = "anthropic"
model = "claude-haiku-5-5"
prompt = "connect4/v1"
temperature = "omit"            # the Anthropic adapter never sends sampling params
max_tokens = 256
price_input_per_mtok = 0.10     # verify
price_output_per_mtok = 0.50    # verify

[[players]]
id = "haiku-4.5/c4-v1"
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
prompt = "connect4/v1"
temperature = "omit"
max_tokens = 256
price_input_per_mtok = 1.00     # verify
price_output_per_mtok = 5.00    # verify

# Optional: only for OpenAI players. Needs OPENAI_API_KEY in .env and [providers.openai].
# [[players]]
# id = "gpt-5-mini/c4-v1"
# provider = "openai"
# model = "gpt-5-mini"
# prompt = "connect4/v1"
# temperature = "omit"          # don't send it: some OpenAI models reject non-default values
# max_tokens = 1024             # reasoning models spend output tokens before the tool call
# price_input_per_mtok = 0.25   # verify
# price_output_per_mtok = 2.00  # verify

# Claude Sonnet 5.5, Opus 5.5 and Fable 5.1 reject forced tool use, so they need
# tool_choice = "auto" (default "forced"). A reply with no tool call is an invalid attempt.
# thinking_budget sets manual thinking (needs "auto", 1024 or more, below max_tokens). Only
# older models accept it: see the thinking gotcha in CLAUDE.md. thinking_mode = "between_tools"
# turns off up-front thinking on Sonnet 5.5 (needs "auto"). effort sets output_config.effort.
# Any of these settings makes a new player.

# [[players]]
# id = "sonnet/c4-v1"
# provider = "anthropic"
# model = "<model id>"
# prompt = "connect4/v1"
# price_input_per_mtok = 0.0    # fill in
# price_output_per_mtok = 0.0   # fill in

# Werewolf: both Haikus in four play styles, so a 7-seat table has 7 distinct players.
# Messages are cut at 300 characters; max_tokens leaves room to see how far they ran over.

[[players]]
id = "haiku-5.5/ww-v1-plain"
provider = "anthropic"
model = "claude-haiku-5-5"
prompt = "werewolf/v1-plain"
temperature = "omit"
max_tokens = 512
price_input_per_mtok = 0.10
price_output_per_mtok = 0.50
price_cache_read_per_mtok = 0.01
price_cache_write_per_mtok = 0.125

