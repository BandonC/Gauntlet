<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LLM Arena{% endblock %}</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1c1c1a; --muted:#6b6b66; --line:#deded8; --x:#c2410c; --o:#1d4ed8; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ececea; --muted:#9a9a94; --line:#2e2e2b; --x:#fb923c; --o:#60a5fa; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px 16px 64px; }
  nav { display:flex; gap:16px; align-items:baseline; padding-bottom:12px;
        border-bottom:1px solid var(--line); margin-bottom:8px; }
  nav .brand { font-weight:700; margin-right:auto; }
  a { color: inherit; } nav a { text-decoration:none; } nav a:hover { text-decoration:underline; }
  h1 { font-size: 20px; margin: 16px 0 4px; } h2 { font-size: 15px; margin: 28px 0 8px; }
  .muted { color: var(--muted); } .bad { color: var(--bad); }
  table { width:100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align: top; }
  th { font-weight:600; font-size:13px; color:var(--muted); }
  td.num, th.num { text-align:right; }
  code { font: 13px ui-monospace, monospace; }
  .wrap { overflow-x: auto; }
  dl { display:grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 8px 0; }
  dt { color: var(--muted); }
</style>
{% block head %}{% endblock %}
</head>
<body>
<main>
  <nav>
    <a class="brand" href="{{ url('index') }}">LLM Arena</a>
    <a href="{{ url('index') }}">Leaderboards</a>
    <a href="{{ url('tournaments') }}">Tournaments</a>
    <a href="{{ url('matches') }}">Matches</a>
  </nav>
  {% block content %}{% endblock %}
</main>
</body>
</html>
