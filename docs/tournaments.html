<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournaments · LLM Arena</title>
<style>
/* Every page's styles, inlined by base.html so exported pages stay single files.
   Motion follows .claude/skills/emil-design-eng: stepping through a replay is instant, press
   feedback is short, and only the Play blind reveal is allowed to perform. */
:root {
  --bg: #f7f7f5; --surface: #ffffff; --fg: #1c1c1a; --muted: #6b6b66; --line: #deded8;
  --accent: #1d4ed8; --x: #c2410c; --o: #1d4ed8; --bad: #b91c1c; --good: #15803d;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --surface: #1f1f1d; --fg: #ececea; --muted: #9a9a94; --line: #2e2e2b;
    --accent: #60a5fa; --x: #fb923c; --o: #60a5fa; --bad: #f87171; --good: #4ade80;
  }
}

/* Base */
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* or `button { display }` beats it */
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
}
main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 64px; }
a { color: inherit; }
p, dd, li { max-width: 62ch; text-wrap: pretty; }
h1 { font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 17px; margin: 36px 0 8px; }
h3 { font-size: 13px; color: var(--muted); margin: 16px 0 4px; }
code { font: 13px ui-monospace, monospace; }
small, .muted { color: var(--muted); }
.bad { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Navigation and page headers */
nav {
  display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline;
  padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 24px;
}
nav a { text-decoration: none; }
nav .brand { font-weight: 700; margin-right: auto; }
.page-head { margin-bottom: 20px; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.jump { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 12px 0 0; }
.jump a { color: var(--muted); }

/* Tables. Numbers line up; player ids wrap rather than stretching a column. */
.wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.rank { color: var(--muted); }
td.quiet, th.quiet { color: var(--muted); }
td.lead { font-weight: 600; }
.pid { overflow-wrap: anywhere; }
.pid span { color: var(--muted); }

/* Stats: a tournament or match at a glance */
.stats { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 16px 0; }
.stats dt { color: var(--muted); font-size: 13px; }
.stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats div { min-width: 0; }

/* Controls */
button, .btn {
  font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: inherit; text-decoration: none; display: inline-block;
  cursor: pointer; transition: transform 120ms var(--ease-out);
}
button:active:not(:disabled), .btn:active { transform: scale(0.97); }
button:disabled { opacity: 0.5; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.controls input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
summary { cursor: pointer; color: var(--muted); }
details.fold { margin-top: 36px; }
details.fold > summary { font-size: 17px; font-weight: 600; color: var(--fg); }
details.note { margin: 12px 0 0; }

/* The invitation to play blind */
.callout {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
  padding: 14px 16px; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface);
}
.callout p { margin: 0; flex: 1 1 280px; }
.callout .btn, .callout button { flex-shrink: 0; }

/* Replay */
#replay-info { min-height: 1.5em; }
.status { font-weight: 600; }
.ww { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px 24px; }
.ww ul { list-style: none; margin: 0; padding: 0; }
.ww li { margin: 0 0 8px; }
.ww .ld { width: 100%; }
.c4 {
  display: grid; grid-template-columns: repeat(7, 34px); gap: 4px; padding: 8px; width: max-content;
  background: color-mix(in srgb, var(--o) 18%, transparent); border-radius: 8px;
}
.c4 .cell { width: 34px; height: 34px; border-radius: 50%; background: var(--bg); }
.c4 .disc.X { background: var(--x); } .c4 .disc.O { background: var(--o); }
.ld { width: auto; } .ld .dice { font-size: 26px; line-height: 1; letter-spacing: 2px; }
.ld tr.turn td { font-weight: 600; } .die.hit { color: var(--x); }
.ld .dice .muted { font-size: 15px; letter-spacing: 0; }
.ld-bids .die, .reveal .die { font-size: 22px; line-height: 1; vertical-align: -3px; }
tr[data-frame] { cursor: pointer; }
tr.current td { background: color-mix(in srgb, var(--line) 60%, transparent); }

/* Play blind. Spoilers stay hidden from the first paint when the link says #blind. */
#blind { display: none; }
.blind #blind { display: block; }
.blind .spoiler { display: none; }
.blind-head { position: sticky; top: 0; background: var(--bg); padding: 4px 0; border-bottom: 1px solid var(--line); }
.blind-head p { margin: 6px 0; }
.blind-foot { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0; margin: 0; border-top: 1px solid var(--line); }
.seats { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.seat { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; }
.seat.on { border-color: var(--bad); color: var(--bad); font-weight: 600; }
.seat.dead { color: var(--muted); text-decoration: line-through; }
.seat.dead small { display: inline-block; }
.said { margin: 4px 0; }
tr.wolf td { color: var(--bad); font-weight: 600; }
tr.unmask { animation: unmask 240ms var(--ease-out) both; animation-delay: calc(var(--i) * 60ms); }
@keyframes unmask { from { opacity: 0; transform: translateY(4px); } }

@media (hover: hover) and (pointer: fine) {
  nav a:hover, .jump a:hover { text-decoration: underline; }
  tbody tr:hover td { background: color-mix(in srgb, var(--line) 30%, transparent); }
}
@media (max-width: 760px) {
  .ww { grid-template-columns: minmax(0, 1fr); }
  td.quiet, th.quiet { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  button:active:not(:disabled), .btn:active { transform: none; }
  @keyframes unmask { from { opacity: 0; } }
}

</style>
</head>
