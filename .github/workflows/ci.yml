name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # The same script as the pre-commit hook: ruff, ruff format --check, pytest, pytest -m db.
    name: checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # the declared minimum, and the version developed on
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena_test  # check.sh refuses any other name: the db tests drop the schema
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U arena -d arena_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://arena:arena@localhost:5433/arena_test
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4  # tests/test_replay_js.py runs the replay script in Node
        with:
          node-version: "20"
      - run: python -m pip install -e ".[dev]"
      - run: scripts/check.sh

  typecheck:
    # Not yet required: mypy reports 30 errors today. Phase 13's second item fixes them, adds mypy
    # to scripts/check.sh, and removes continue-on-error here.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy arena
