[project]
name = "llm-arena"
version = "0.1.0"
description = "Tournaments between LLM players across turn-based games"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "numpy>=2.0",
    "scikit-learn>=1.5",
]
# Phase 11 analysis: CFR training (numpy) and the wolf detector (scikit-learn). Bots read the
# trained policy with the stdlib only, so neither is a runtime dependency.
ml = ["numpy>=2.0", "scikit-learn>=1.5"]

[project.scripts]
arena = "arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-m "not slow"'  # a -m on the command line replaces this one
markers = [
    "db: needs a running Postgres (DATABASE_URL)",
    "slow: long simulations, run with pytest -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true

# Core modules carry the invariants, so they get the strict settings: every function typed,
# no bare generics (`dict`, `list` with no parameters).
[[tool.mypy.overrides]]
module = ["arena.types", "arena.games.*", "arena.engine.*", "arena.players.*", "arena.ratings.*", "arena.costs"]
disallow_untyped_defs = true
disallow_any_generics = true
