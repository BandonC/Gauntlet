# Local Postgres only. The app itself runs on the host (`arena ...`) during development.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    ports:
      - "5434:5432"  # 5432 is often taken by a native Postgres install
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena"]
      interval: 2s
      retries: 15

  # Disposable database for `pytest -m db` (tests DROP the public schema).
  testdb:
    image: postgres:16
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # Optional: docker compose --profile observability up -d
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP over HTTP

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
